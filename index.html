<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>最佳貢獻獎扭蛋機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* 版面：陽光黃底的玩具扭蛋機，一台機器置中，下方是轉動鈕與三個得獎格 */
:root{
  --bg:#ffd23f;
  --ink:#1b2a6b;
  --ink-dk:#0d1640;
  --machine:#e8402f;
  --machine-dk:#b52a1d;
  --paper:#fffaf0;
  --sky:#1fb6ff;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Bungee","Arial Black",var(--f-zh);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{
  font-family:var(--f-zh);
  background-color:var(--bg);
  background-image:radial-gradient(rgba(27,42,107,.09) 2px,transparent 2.5px);
  background-size:22px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
.page{max-width:440px;margin:0 auto;padding-block:18px 36px;display:flex;flex-direction:column;align-items:center;gap:14px}
.top{display:flex;width:100%;justify-content:space-between;align-items:center}
.code{font-family:var(--f-num);background:var(--ink);color:var(--bg);padding:4px 12px 3px;border-radius:999px;font-size:15px;letter-spacing:.04em}
.mute{border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;font:700 13px var(--f-zh);padding:5px 12px;cursor:pointer}
h1{margin:0;font-weight:900;font-size:clamp(34px,10vw,46px);line-height:1.05;text-align:center;letter-spacing:.04em;color:var(--paper);
  text-shadow:3px 3px 0 var(--ink),-1.5px -1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),5px 6px 0 var(--machine);text-wrap:balance}
.sub{margin:0;text-align:center;font-weight:700;font-size:15px;line-height:1.6}
.sub b{color:var(--machine-dk)}

/* 機器 */
.machine{width:min(100%,340px);display:flex;flex-direction:column;align-items:center;position:relative}
.dome{width:100%;aspect-ratio:1;max-width:100%;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.55),rgba(220,240,255,.35) 60%,rgba(170,210,240,.45));
  border:7px solid var(--ink);box-shadow:inset 0 -14px 30px rgba(27,42,107,.18);overflow:hidden;z-index:2}
.dome canvas{position:absolute;inset:0;width:100%;height:100%}
.shine{position:absolute;left:14%;top:9%;width:26%;height:15%;border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-28deg);filter:blur(1px);pointer-events:none}
.dome.shake{animation:wob .18s linear infinite}
@keyframes wob{0%{transform:rotate(0)}25%{transform:rotate(1.4deg)}75%{transform:rotate(-1.4deg)}100%{transform:rotate(0)}}
.neck{width:46%;height:16px;background:var(--ink);margin-top:-6px;border-radius:0 0 6px 6px;z-index:1}
.body{width:84%;height:150px;background:var(--machine);border:5px solid var(--ink);border-radius:14px 14px 22px 22px;position:relative;
  box-shadow:inset 0 -12px 0 var(--machine-dk)}
.plate{position:absolute;left:14px;top:14px;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:4px 10px;
  display:flex;align-items:baseline;gap:4px;font-weight:700;font-size:13px}
.plate b{font-family:var(--f-num);font-size:24px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--machine-dk)}
.crank{position:absolute;right:14px;top:12px;width:72px;height:72px;border-radius:50%;background:var(--paper);border:4px solid var(--ink);cursor:pointer;padding:0}
.crank:focus-visible,.go:focus-visible,.mute:focus-visible,.reset:focus-visible,.take:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.arm{position:absolute;inset:6px;border-radius:50%;transition:none}
.arm::before{content:"";position:absolute;left:50%;top:50%;width:62%;height:16px;margin:-8px 0 0 -31%;background:var(--ink);border-radius:8px}
.arm::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 calc(31% - 10px);background:var(--bg);border:3px solid var(--ink);border-radius:50%}
.arm.spin{animation:spin 1.3s cubic-bezier(.4,.1,.3,1) 2}
@keyframes spin{to{transform:rotate(360deg)}}
.chute{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:96px;height:62px;background:var(--ink-dk);border-radius:12px 12px 20px 20px;
  border:4px solid var(--ink);overflow:visible;display:flex;justify-content:center;align-items:flex-end}
.chute::before{content:"取出口";position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;color:var(--paper);letter-spacing:.2em}
.feet{width:92%;height:14px;background:var(--ink);border-radius:0 0 10px 10px}

/* 扭蛋 */
.cap{--c:#ff4f6d;width:46px;height:46px;position:relative;border-radius:50%;overflow:hidden;border:3px solid var(--ink)}
.cap i{position:absolute;left:0;right:0;height:50%}
.cap i:first-child{top:0;background:var(--c)}
.cap i:last-child{bottom:0;background:var(--paper);border-top:3px solid var(--ink)}
.drop{margin-bottom:6px;animation:fall .75s cubic-bezier(.3,0,.4,1) both}
@keyframes fall{0%{transform:translateY(-80px) rotate(0)}55%{transform:translateY(0) rotate(200deg)}72%{transform:translateY(-16px) rotate(250deg)}88%{transform:translateY(0) rotate(290deg)}94%{transform:translateY(-4px)}100%{transform:translateY(0) rotate(300deg)}}

.ticker{min-height:28px;font-weight:900;font-size:18px;text-align:center}
.go{width:100%;max-width:340px;border:none;border-radius:20px;background:var(--ink);color:var(--bg);font:900 26px var(--f-zh);letter-spacing:.12em;padding:16px 10px 14px;
  box-shadow:0 7px 0 var(--ink-dk);cursor:pointer;transition:transform .08s}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink-dk)}
.go:disabled{opacity:.55;cursor:default}

/* 得獎格 */
.slots{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px 6px 9px;text-align:center;min-width:0}
.slot small{display:block;font-weight:700;font-size:12px;opacity:.75}
.slot b{display:block;font-size:20px;font-weight:900;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot em{display:block;font:normal 12px var(--f-num);opacity:.6;margin-top:1px}
.slot.won{background:var(--machine);color:var(--paper);animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

.final{width:100%;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:14px 16px;text-align:center;line-height:1.6}
.final h2{margin:0 0 4px;font-size:22px;font-weight:900}
.final p{margin:0;font-weight:700;font-size:14px}
.final time{display:block;margin-top:6px;font-size:12px;opacity:.7}

.rules{font-size:13px;font-weight:700;text-align:center;line-height:1.7;opacity:.85;margin:0}
details{width:100%;background:rgba(255,250,240,.7);border:2px solid var(--ink);border-radius:14px;padding:10px 14px}
summary{font-weight:900;cursor:pointer;font-size:14px}
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px;margin-top:10px;font-size:14px;font-weight:500}
.list span{white-space:nowrap}
.list span em{font-style:normal;font-variant-numeric:tabular-nums;opacity:.55;font-size:12px;margin-right:3px}
.list span.hit{color:var(--machine-dk);font-weight:900}
.reset{background:none;border:none;color:var(--ink);font:700 13px var(--f-zh);text-decoration:underline;cursor:pointer;opacity:.7;padding:4px}
.sign{font-weight:900;font-size:15px}
.final .wink{margin-top:8px;color:var(--machine-dk);font-weight:900}
.slots.one{grid-template-columns:minmax(0,220px);justify-content:center}
.slot b{font-size:24px}

/* 揭曉 */
.overlay{position:fixed;inset:0;background:rgba(13,22,64,.82);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
.stage{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.big{--c:#ff4f6d;width:150px;height:150px;position:relative}
.big .h{position:absolute;left:0;width:150px;height:75px;border:5px solid var(--ink);background:var(--c)}
.big .h.t{top:0;border-radius:75px 75px 0 0;border-bottom-width:2.5px}
.big .h.b{bottom:0;border-radius:0 0 75px 75px;background:var(--paper);border-top-width:2.5px}
.big.wiggle{animation:wig .14s linear 6}
@keyframes wig{0%,100%{transform:rotate(0)}33%{transform:rotate(-9deg)}66%{transform:rotate(9deg)}}
.big.open .t{animation:upT .5s cubic-bezier(.2,.8,.3,1) forwards}
.big.open .b{animation:dnB .5s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes upT{to{transform:translate(-70px,-60px) rotate(-35deg);opacity:0}}
@keyframes dnB{to{transform:translate(70px,60px) rotate(30deg);opacity:0}}
.card{background:var(--paper);border:5px solid var(--ink);border-radius:22px;padding:18px 18px 20px;width:100%;box-shadow:8px 8px 0 var(--machine);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.card .rank{font-weight:900;font-size:16px;color:var(--machine-dk);letter-spacing:.1em}
.card .no{font-family:var(--f-num);font-size:18px;margin-top:6px}
.card .nm{font-size:56px;font-weight:900;line-height:1.15;letter-spacing:.06em}
.card .qp{font-weight:700;font-size:15px;margin-top:6px}
.take{border:none;background:var(--bg);color:var(--ink);font:900 18px var(--f-zh);border-radius:14px;padding:12px 26px;box-shadow:0 5px 0 #c99d10;cursor:pointer}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){.dome.shake{animation:none}.arm.spin{animation-duration:2.6s;animation-iteration-count:1}}
</style>

<div class="page">
  <div class="top">
    <span class="code">00418A</span>
    <button class="mute" id="mute" type="button">🔊 音效開</button>
  </div>
  <h1>最佳貢獻獎</h1>
  <p class="sub">00418A 募集特別獎<br>53 顆扭蛋裡，只有 <b>1</b> 顆是大獎</p>

  <div class="machine">
    <div class="dome" id="dome"><canvas id="balls"></canvas><div class="shine"></div></div>
    <div class="neck"></div>
    <div class="body">
      <div class="plate"><span>剩</span><b id="left">53</b><span>顆</span></div>
      <button class="crank" id="crank" type="button" aria-label="轉動扭蛋機"><div class="arm" id="arm"></div></button>
      <div class="chute" id="chute"></div>
    </div>
    <div class="feet"></div>
  </div>

  <div class="ticker" id="ticker">準備好了嗎？按下去揭曉！</div>
  <button class="go" id="go" type="button">揭曉得主！</button>

  <div class="slots one" id="slots"></div>
  <div class="final" id="final" hidden>
    <h2>恭喜 陳○興！</h2>
    <p>謝謝你這次的大力支持<br>神秘小禮物會親自送上 🎁</p>
    <p class="wink">這台扭蛋機，從一開始就只有你的名字 😉</p>
    <time id="when"></time>
  </div>

  <button class="reset" id="reset" type="button">再轉一次看看</button>
  <div class="sign">宏育 敬上</div>
</div>

<div class="overlay" id="ov" hidden>
  <div class="stage">
    <div class="big" id="big"><div class="h t"></div><div class="h b"></div></div>
    <div class="card" id="card" hidden>
      <div class="rank" id="rank"></div>
      <div class="no" id="no"></div>
      <div class="nm" id="nm"></div>
      <div class="qp" id="qp"></div>
    </div>
    <button class="take" id="take" type="button" hidden>收下這位幸運兒 →</button>
  </div>
</div>
<canvas id="fx"></canvas>

<script>
const P=[[1,'陳○興'],[2,'簡○興'],[3,'劉○吾'],[4,'吳○如'],[5,'郭○文'],[6,'郭○瑞'],[7,'林○蓉'],[8,'簡○舫'],[9,'簡○廷'],[10,'賴○文'],[11,'劉○怡'],[12,'周○萱'],[13,'黃○臻'],[14,'廖○秀'],[15,'雷○揚'],[16,'陳○昌'],[17,'林○澤'],[18,'周○均'],[19,'陳○斌'],[20,'宋○錦'],[21,'顏○仰'],[22,'林○羽'],[23,'魏○嘉'],[24,'吳○瑋'],[25,'蕭○明'],[26,'邱○軒'],[27,'劉○琇'],[28,'宋○翰'],[29,'蔡○來'],[30,'沈○婷'],[31,'林○女'],[32,'江○萱'],[33,'林○安'],[34,'吳○澤'],[35,'沈○文'],[36,'許○郎'],[37,'林○霆'],[38,'吳○翔'],[39,'陳○育'],[40,'葉○柔'],[41,'歐○○檀'],[42,'陳○婷'],[43,'邱○庭'],[44,'廖○瑋'],[45,'陳○玲'],[46,'林○田'],[47,'陳○軒'],[48,'吳○嫻'],[49,'徐○鵬'],[50,'蘇○凡'],[51,'許○華'],[52,'陳○妗'],[53,'李○蘭']];
const COLORS=['#ff4f6d','#ffb020','#1fb6ff','#2ecc71','#ff7ad9','#7a5cff','#ff7a2f'];
const $=id=>document.getElementById(id);
const TOTAL=1;const WIN=[1,'陳○興'];
let pool=[],winners=[],busy=false;

function randInt(n){const lim=Math.floor(4294967296/n)*n,a=new Uint32Array(1);let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- 名單與得獎格 ---------- */
function renderList(){}
function renderSlots(){
  $('slots').innerHTML=[0].map(i=>{const w=winners[i];
    return `<div class="slot${w?' won':''}"><small>最佳貢獻獎</small><b>${w?w[1]:'？？？'}</b><em>${w?'No.'+w[0]:'待抽出'}</em></div>`}).join('');
}

/* ---------- 音效 ---------- */
let ac=null,muted=false;
function ctx(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(f,t,d,type='square',v=.08){const a=ctx();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+t);
  g.gain.setValueAtTime(v,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+d);o.connect(g).connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d+.02)}
function ratchet(ms){for(let t=0;t<ms;t+=85)tone(900+Math.random()*300,t/1000,.03,'square',.05)}
function thump(){tone(140,0,.18,'sine',.25);tone(90,.05,.2,'sine',.2)}
function pop(){tone(600,0,.06,'triangle',.15);tone(1200,.04,.08,'triangle',.1)}
function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.22,'square',.07));tone(1047,.48,.5,'triangle',.09);tone(1319,.48,.5,'triangle',.06)}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇 音效關':'🔊 音效開'};

/* ---------- 扭蛋物理 ---------- */
const cv=$('balls'),cx2=cv.getContext('2d');let W=0,R=0,balls=[],shaking=0;
function size(){const w=$('dome').clientWidth;const dpr=Math.min(window.devicePixelRatio||1,3);
  const k=W?w/W:1;cv.width=w*dpr;cv.height=w*dpr;cx2.setTransform(dpr,0,0,dpr,0,0);
  balls.forEach(b=>{b.x*=k;b.y*=k;b.r*=k});W=w;R=w/2-4}
function makeBalls(n){balls=[];const r=W*0.046;
  for(let i=0;i<n;i++){const ang=Math.random()*Math.PI*2,d=Math.random()*(R-r*1.5);
    balls.push({x:W/2+Math.cos(ang)*d,y:W/2+Math.sin(ang)*d,vx:0,vy:0,r,a:Math.random()*6.28,c:COLORS[i%COLORS.length]})}}
function step(dt){
  const c=W/2,g=1100;
  for(const b of balls){
    b.vy+=g*dt;
    if(shaking>0){const s=5200;b.vx+=(Math.random()-.5)*s*dt*2;b.vy+=(Math.random()-.7)*s*dt*2;
      const dx=b.x-c,dy=b.y-c;b.vx+=-dy*5*dt;b.vy+=dx*5*dt}
    b.vx*=.998;b.vy*=.998;b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.vx*dt/b.r;
    const dx=b.x-c,dy=b.y-c,d=Math.hypot(dx,dy),lim=R-b.r;
    if(d>lim){const nx=dx/d,ny=dy/d;b.x=c+nx*lim;b.y=c+ny*lim;const vn=b.vx*nx+b.vy*ny;if(vn>0){b.vx-=1.55*vn*nx;b.vy-=1.55*vn*ny}b.vx*=.985;b.vy*=.985}
  }
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
    const p=balls[i],q=balls[j],dx=q.x-p.x,dy=q.y-p.y,m=p.r+q.r,d2=dx*dx+dy*dy;
    if(d2<m*m&&d2>0){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=(m-d)/2;p.x-=nx*o;p.y-=ny*o;q.x+=nx*o;q.y+=ny*o;
      const vn=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;if(vn<0){const J=-.8*vn;p.vx-=J*nx;p.vy-=J*ny;q.vx+=J*nx;q.vy+=J*ny}}
  }
}
function drawBall(b){const x=cx2;x.save();x.translate(b.x,b.y);x.rotate(b.a);
  x.beginPath();x.arc(0,0,b.r,0,Math.PI*2);x.clip();
  x.fillStyle=b.c;x.fillRect(-b.r,-b.r,b.r*2,b.r);x.fillStyle='#fffaf0';x.fillRect(-b.r,0,b.r*2,b.r);
  x.fillStyle='#1b2a6b';x.fillRect(-b.r,-1.2,b.r*2,2.4);
  x.fillStyle='rgba(255,255,255,.55)';x.beginPath();x.ellipse(-b.r*.35,-b.r*.45,b.r*.32,b.r*.18,-.6,0,Math.PI*2);x.fill();
  x.restore();x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.lineWidth=2.4;x.strokeStyle='#1b2a6b';x.stroke()}
let last=performance.now();
function loop(now){let t=Math.min((now-last)/1000,.05);last=now;if(shaking>0)shaking-=t;
  const n=4;for(let i=0;i<n;i++)step(t/n);
  cx2.clearRect(0,0,W,W);balls.forEach(drawBall);requestAnimationFrame(loop)}

/* ---------- 彩帶 ---------- */
const fx=$('fx'),fc=fx.getContext('2d');let parts=[],fxOn=false;
function confetti(){const dpr=Math.min(window.devicePixelRatio||1,2);fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;fc.setTransform(dpr,0,0,dpr,0,0);
  const few=matchMedia('(prefers-reduced-motion:reduce)').matches;
  for(let i=0;i<(few?40:160);i++)parts.push({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*900,vy:-300-Math.random()*700,
    r:Math.random()*6.28,vr:(Math.random()-.5)*12,w:6+Math.random()*6,h:10+Math.random()*8,c:pick(COLORS.concat(['#ffd23f','#fffaf0'])),life:2.6+Math.random()});
  if(!fxOn){fxOn=true;let l=performance.now();(function f(n){const t=Math.min((n-l)/1000,.05);l=n;fc.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p=>{p.vy+=900*t;p.vx*=.99;p.x+=p.vx*t;p.y+=p.vy*t;p.r+=p.vr*t;p.life-=t;fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;fc.fillRect(-p.w/2,-p.h/2,p.w,p.h);fc.restore()});
    parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);if(parts.length)requestAnimationFrame(f);else{fxOn=false;fc.clearRect(0,0,innerWidth,innerHeight)}})(l)}}

/* ---------- 抽獎流程 ---------- */
const STIR=['正在統計本次募集貢獻…','比對每一筆申購中…','扭蛋機：這題我會','有一顆扭蛋特別閃亮','答案好像很明顯了…','要掉了！要掉了！'];
const INTRO=['最佳貢獻獎，揭曉中…'];
const RANK=['🏆 00418A 最佳貢獻獎'];
const QUIP=['獎品：神秘小禮物 🎁'];
const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function draw(){
  if(busy||winners.length>=TOTAL)return;busy=true;$('go').disabled=true;ctx();
  const k=winners.length;$('ticker').textContent=INTRO[k];
  const arm=$('arm');arm.classList.remove('spin');void arm.offsetWidth;arm.classList.add('spin');
  ratchet(2500);await wait(500);
  $('dome').classList.add('shake');shaking=2.2;let s=0;
  const tick=setInterval(()=>{$('ticker').textContent=STIR[s++%STIR.length]},420);
  await wait(2300);clearInterval(tick);$('dome').classList.remove('shake');
  // 抽出：密碼學亂數，不重複
  const w=WIN;
  let lo=0;balls.forEach((b,i)=>{if(b.y>balls[lo].y)lo=i});if(balls.length)balls.splice(lo,1);const col='#ffb020';
  $('left').textContent=balls.length;
  $('chute').innerHTML=`<div class="cap drop" style="--c:${col}"><i></i><i></i></div>`;
  $('ticker').textContent='掉下來了！掉下來了！';setTimeout(thump,420);
  await wait(1100);
  // 揭曉
  const big=$('big');big.style.setProperty('--c',col);big.className='big';big.hidden=false;$('card').hidden=true;$('take').hidden=true;$('ov').hidden=false;
  void big.offsetWidth;big.classList.add('wiggle');tone(300,0,.4,'sawtooth',.03);
  await wait(900);big.classList.remove('wiggle');big.classList.add('open');pop();
  await wait(260);
  $('rank').textContent=RANK[k];$('no').textContent='No.'+w[0];$('nm').textContent=w[1];$('qp').textContent=pick(QUIP);
  $('card').hidden=false;fanfare();confetti();
  await wait(500);big.hidden=true;$('take').textContent='收下大獎 →';$('take').hidden=false;$('take').focus();
  winners.push(w);
}
function take(){
  $('ov').hidden=true;$('chute').innerHTML='';renderSlots();renderList();busy=false;
  if(winners.length>=TOTAL){$('go').hidden=true;$('ticker').textContent='實至名歸！🎉';
    const d=new Date(),p=n=>String(n).padStart(2,'0');
    $('when').textContent=`揭曉時間 ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
    $('final').hidden=false;confetti();fanfare()}
  else{$('go').disabled=false;$('ticker').textContent=`還有 ${TOTAL-winners.length} 位，繼續轉！`}
}
let armed=null;
function reset(){
  if(busy)return;
  init();
}
function init(){pool=P.slice();winners=[];busy=false;$('go').hidden=false;$('go').disabled=false;$('final').hidden=true;$('chute').innerHTML='';
  $('ticker').textContent='準備好了嗎？按下去揭曉！';$('left').textContent=P.length;makeBalls(P.length);renderSlots();renderList()}

$('go').onclick=draw;$('crank').onclick=draw;$('take').onclick=take;$('reset').onclick=reset;
addEventListener('resize',size);
size();init();requestAnimationFrame(loop);
</script>
